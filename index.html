<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECO-SORT ULS</title>
<style>
:root{--bg:#f1f4f6;--fg:#1c2530;--cd:#fff;--bd:#d5dbe1;--ac:#1b6ec2;--ok:#2e9d5b;--wa:#e0a21b;--er:#d64545}
@media(prefers-color-scheme:dark){:root{--bg:#141a21;--fg:#e4e9ee;--cd:#1e2630;--bd:#323d4a;--ac:#5aa9f5}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--bd);background:var(--cd)}
h1{font-size:18px;margin:0;flex:1}h2{font-size:15px;margin:22px 0 8px}
.chip{padding:3px 10px;border-radius:99px;font-size:13px;background:var(--er);color:#fff}.chip.on{background:var(--ok)}
button{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:#fff;cursor:pointer}
button.p{background:var(--wa);border-color:var(--wa);color:#222}
main{max-width:900px;margin:0 auto;padding:16px}
#alerta{display:none;background:var(--er);color:#fff;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-weight:600}
#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px}
.card h3{margin:0 0 4px;font-size:15px}.num{font-size:34px;font-weight:700}
.bar{height:12px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
table{width:100%;border-collapse:collapse;background:var(--cd);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--bd);font-size:14px}th{opacity:.7}
</style></head><body>
<header><h1>ECO-SORT ULS · Panel del clasificador</h1><span id="con" class="chip">Sin conexión</span><button id="bp">Pausar banda</button></header>
<main>
<div id="alerta"></div>
<section id="cards"></section>
<h2>Eventos recientes</h2>
<table><thead><tr><th>Hora</th><th>Evento</th><th>Categoría</th></tr></thead><tbody id="ev"><tr><td colspan="3">Sin eventos todavía</td></tr></tbody></table>
</main>
<script>
const N=['Metal','Orgánico','Variado'],K=['metal','organico','variado'];
const T={objeto:'Objeto clasificado',lleno:'RECIPIENTE LLENO',reanuda:'Reanudado (nivel bajo 70 %)',inicio:'Sistema iniciado'};
document.getElementById('cards').innerHTML=N.map((n,i)=>`<div class="card"><h3>${n}</h3><div class="num" id="c${i}">0</div><small>objetos clasificados</small><div class="bar"><i id="b${i}"></i></div><div id="l${i}">Nivel: 0 %</div></div>`).join('');
let pausa=false;
const $=id=>document.getElementById(id);
async function act(){
  try{
    const d=await (await fetch('/api/estado')).json();
    pausa=d.pausa;
    $('con').textContent=d.conectado?'Arduino conectado':'Arduino sin conexión';
    $('con').className='chip'+(d.conectado?' on':'');
    $('bp').textContent=pausa?'Reanudar banda':'Pausar banda';
    $('bp').className=pausa?'':'p';
    d.niveles.forEach((v,i)=>{
      $('c'+i).textContent=d.contadores[i];
      $('l'+i).textContent='Nivel: '+v+' %';
      const b=$('b'+i);b.style.width=v+'%';
      b.style.background=v>=85?'var(--er)':v>=70?'var(--wa)':'var(--ok)';
    });
    const a=$('alerta');
    if(d.lleno){a.style.display='block';a.textContent='RECIPIENTE LLENO: '+d.lleno.toUpperCase()+'. Vacíalo para reanudar.'}
    else if(pausa){a.style.display='block';a.style.background='var(--wa)';a.style.color='#222';a.textContent='Banda en pausa desde el panel.'}
    else a.style.display='none';
    if(d.lleno){a.style.background='var(--er)';a.style.color='#fff'}
    if(d.eventos.length)$('ev').innerHTML=d.eventos.slice(0,15).map(e=>`<tr><td>${new Date(e.fecha).toLocaleTimeString()}</td><td>${T[e.evento]||e.evento}</td><td>${e.categoria||'-'}</td></tr>`).join('');
  }catch(e){$('con').textContent='Servidor sin respuesta';$('con').className='chip'}
}
$('bp').onclick=async()=>{await fetch('/api/pausa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pausa:!pausa})});act()};
act();setInterval(act,2000);
</script></body></html>
